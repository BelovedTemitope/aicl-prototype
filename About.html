<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ open: 0, guideOpen: false }, {}); }
  componentDidMount() {
    if (!true) return;
    let seen = false; try { seen = window.sessionStorage.getItem("aiclGuideSeen") === "1"; } catch (err) {}
    if (seen) return;
    this._show = () => { if (this._done) return; this._done = true; try { window.sessionStorage.setItem("aiclGuideSeen", "1"); } catch (err) {} this.setState({ guideOpen: true }); };
    this._timer = setTimeout(this._show, 15000);
    this._onScroll = () => { const d = document.documentElement; if ((window.scrollY + window.innerHeight) / d.scrollHeight > 0.5) this._show(); };
    window.addEventListener("scroll", this._onScroll, { passive: true });
  }
  componentWillUnmount() { clearTimeout(this._timer); if (this._onScroll) window.removeEventListener("scroll", this._onScroll); }
  renderVals() {
    const s = this.state;
    const FAQ = [["Is the consultation really free?", "Yes. Your first consultation with an AICL counsellor is free, in person at Ikeja or Alapere, or online. You leave with a clear list of options for your grades, budget and preferred country."], ["What does AICL charge for its services?", "Service fees depend on the country and the support you need, so they are explained during your free consultation, before you commit to anything."], ["How long does the whole process take?", "It depends on the country, the course and the intake. Your counsellor gives you a timeline at the consultation. Starting early gives you more course options and time to fix documents."], ["Which office should I visit?", "Either: Ikeja is our head office at 5 Sadiku Street, Agidingbi, and our Alapere office is on the 2nd Floor, 19 Ladejobi Street, Ketu. You can also meet a counsellor online from anywhere in Nigeria."], ["Is AICL a recognised agent?", "AICL has placed Nigerian students with international universities since 2011, and was named Best Performing Agent by Oxford International Education Group in 2023."]];
    const faqs = FAQ.map((f, i) => ({ q: f[0], a: f[1], isOpen: s.open === i, sign: s.open === i ? "\u2212" : "+", toggle: () => this.setState({ open: s.open === i ? -1 : i }) }));
    const openGuide = () => { this._done = true; this.setState({ guideOpen: true }); };
    const closeGuide = () => { this._done = true; try { window.sessionStorage.setItem("aiclGuideSeen", "1"); } catch (err) {} this.setState({ guideOpen: false }); };

    return Object.assign({ showNotes: this.props.showNotes ?? true, faqs: faqs, guideOpen: s.guideOpen, openGuide: openGuide, closeGuide: closeGuide }, {});
  }
}
