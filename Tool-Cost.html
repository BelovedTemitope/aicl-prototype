<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ open: 0, guideOpen: false }, { country: "UK", level: "Master's" }); }
  componentDidMount() {
    if (!true) return;
    let seen = false; try { seen = window.sessionStorage.getItem("aiclGuideSeen") === "1"; } catch (err) {}
    if (seen) return;
    this._show = () => { if (this._done) return; this._done = true; try { window.sessionStorage.setItem("aiclGuideSeen", "1"); } catch (err) {} this.setState({ guideOpen: true }); };
    this._timer = setTimeout(this._show, 15000);
    this._onScroll = () => { const d = document.documentElement; if ((window.scrollY + window.innerHeight) / d.scrollHeight > 0.5) this._show(); };
    window.addEventListener("scroll", this._onScroll, { passive: true });
  }
  componentWillUnmount() { clearTimeout(this._timer); if (this._onScroll) window.removeEventListener("scroll", this._onScroll); }
  renderVals() {
    const s = this.state;
    const FAQ = [["How accurate are these figures?", "They are ranges, not quotes. Tuition varies by university and course, and the naira exchange rate changes often. Each figure shows the date it was last updated."], ["Does this include AICL's service fee?", "No. AICL's service fees are explained in your free consultation."], ["What is proof of funds?", "Evidence that you or your sponsor can pay tuition and living costs, usually bank statements held for a set period. The rules differ by country."], ["Is the consultation really free?", "Yes. Your first consultation with an AICL counsellor is free, in person at Ikeja or Alapere, or online. You leave with a clear list of options for your grades, budget and preferred country."]];
    const faqs = FAQ.map((f, i) => ({ q: f[0], a: f[1], isOpen: s.open === i, sign: s.open === i ? "\u2212" : "+", toggle: () => this.setState({ open: s.open === i ? -1 : i }) }));

    const DATA = {"UK": {"Undergraduate": [[22, 38], [15, 21], [4, 5]], "Master's": [[24, 42], [15, 21], [3, 4]]}, "USA": {"Undergraduate": [[30, 70], [18, 28], [1, 2]], "Master's": [[30, 60], [18, 28], [1, 2]]}, "Canada": {"Undergraduate": [[25, 45], [16, 22], [1, 2]], "Master's": [[22, 40], [16, 22], [1, 2]]}, "Ireland": {"Undergraduate": [[20, 40], [16, 22], [1, 1]], "Master's": [[20, 38], [16, 22], [1, 1]]}, "Australia": {"Undergraduate": [[30, 50], [22, 30], [2, 3]], "Master's": [[32, 55], [22, 30], [2, 3]]}, "Germany": {"Undergraduate": [[1, 20], [16, 20], [1, 1]], "Master's": [[1, 22], [16, 20], [1, 1]]}, "Malaysia": {"Undergraduate": [[6, 14], [6, 9], [1, 1]], "Master's": [[6, 15], [6, 9], [1, 1]]}, "Poland": {"Undergraduate": [[4, 8], [8, 11], [1, 1]], "Master's": [[4, 9], [8, 11], [1, 1]]}, "Turkey": {"Undergraduate": [[4, 10], [6, 9], [1, 1]], "Master's": [[4, 10], [6, 9], [1, 1]]}, "Cyprus": {"Undergraduate": [[5, 10], [7, 10], [1, 1]], "Master's": [[5, 11], [7, 10], [1, 1]]}, "Dubai": {"Undergraduate": [[18, 32], [14, 20], [1, 2]], "Master's": [[18, 34], [14, 20], [1, 2]]}};
    const fm = (a) => "\u20a6" + a[0] + "m \u2013 \u20a6" + a[1] + "m";
    const countries = Object.keys(DATA).map(c => ({ label: c, style: pill(s.country === c), pick: () => this.setState({ country: c }) }));

    const d = DATA[s.country][s.level];
    const total = [d[0][0] + d[1][0] + d[2][0], d[0][1] + d[1][1] + d[2][1]];
    const rows = [{ k: "Tuition (first year)", v: fm(d[0]) }, { k: "Living costs (first year)", v: fm(d[1]) }, { k: "Visa and related fees", v: fm(d[2]) }];
    const totalText = fm(total);
    const resultTitle = s.level + " in " + s.country + ": estimated first year";
    const waLink = "https://wa.me/2348028967232?text=" + encodeURIComponent("Hi, I used the Cost Estimator for " + s.level + " in " + s.country + ". Can I get an exact breakdown for my course?");

    return Object.assign({ showNotes: this.props.showNotes ?? true, faqs: faqs, guideOpen: s.guideOpen, openGuide: openGuide, closeGuide: closeGuide }, {countries: countries, levels: levels, rows: rows, totalText: totalText, resultTitle: resultTitle, waLink: waLink});
  }
}

</script>
