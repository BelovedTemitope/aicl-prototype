<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ open: 0, guideOpen: false }, {}); }
  componentDidMount() {
    if (!true) return;
    let seen = false; try { seen = window.sessionStorage.getItem("aiclGuideSeen") === "1"; } catch (err) {}
    if (seen) return;
    this._show = () => { if (this._done) return; this._done = true; try { window.sessionStorage.setItem("aiclGuideSeen", "1"); } catch (err) {} this.setState({ guideOpen: true }); };
    this._timer = setTimeout(this._show, 15000);
    this._onScroll = () => { const d = document.documentElement; if ((window.scrollY + window.innerHeight) / d.scrollHeight > 0.5) this._show(); };
    window.addEventListener("scroll", this._onScroll, { passive: true });
  }
  componentWillUnmount() { clearTimeout(this._timer); if (this._onScroll) window.removeEventListener("scroll", this._onScroll); }
  renderVals() {
    const s = this.state;
    const FAQ = [["When are the intakes for Malaysia?", "The main intakes are Several intakes a year (often Jan/Feb, May, Sep). Some courses have other start dates, so your counsellor confirms the right intake for your course."], ["Do I need IELTS to study in Malaysia?", "Many universities ask for IELTS or another English test, and some accept a waiver based on your WAEC English result. It depends on the university and course."], ["How much proof of funds do I need?", "It depends on the country, city and length of your course. The Cost Estimator gives a naira range, and your counsellor gives the exact figure for your visa."], ["Can I work while studying in Malaysia?", "Most destinations allow eligible students limited part-time work. Rules differ by country and change often, so ask a counsellor for the current position."], ["Is the consultation really free?", "Yes. Your first consultation with an AICL counsellor is free, in person at Ikeja or Alapere, or online. You leave with a clear list of options for your grades, budget and preferred country."]];
    const faqs = FAQ.map((f, i) => ({ q: f[0], a: f[1], isOpen: s.open === i, sign: s.open === i ? "\u2212" : "+", toggle: () => this.setState({ open: s.open === i ? -1 : i }) }));
    const openGuide = () => { this._done = true; this.setState({ guideOpen: true }); };
    const closeGuide = () => { this._done = true; try { window.sessionStorage.setItem("aiclGuideSeen", "1"); } catch (err) {} this.setState({ guideOpen: false }); };

    return Object.assign({ showNotes: this.props.showNotes ?? true, faqs: faqs, guideOpen: s.guideOpen, openGuide: openGuide, closeGuide: closeGuide }, {});
  }
}
