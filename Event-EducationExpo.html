<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ open: 0, guideOpen: false }, {}); }
  componentDidMount() {
    if (!false) return;
    let seen = false; try { seen = window.sessionStorage.getItem("aiclGuideSeen") === "1"; } catch (err) {}
    if (seen) return;
    this._show = () => { if (this._done) return; this._done = true; try { window.sessionStorage.setItem("aiclGuideSeen", "1"); } catch (err) {} this.setState({ guideOpen: true }); };
    this._timer = setTimeout(this._show, 15000);
    this._onScroll = () => { const d = document.documentElement; if ((window.scrollY + window.innerHeight) / d.scrollHeight > 0.5) this._show(); };
    window.addEventListener("scroll", this._onScroll, { passive: true });
  }
  componentWillUnmount() { clearTimeout(this._timer); if (this._onScroll) window.removeEventListener("scroll", this._onScroll); }
  renderVals() {
    const s = this.state;
    const FAQ = [["How do I register?", "Fill in the form on this page. We confirm your place on WhatsApp."], ["What should I bring?", "Your results or transcripts if you have them, so representatives can assess you on the day."], ["Is there an entry fee?", "[AICL to confirm.]"]];
    const faqs = FAQ.map((f, i) => ({ q: f[0], a: f[1], isOpen: s.open === i, sign: s.open === i ? "\u2212" : "+", toggle: () => this.setState({ open: s.open === i ? -1 : i }) }));
    const openGuide = () => { this._done = true; this.setState({ guideOpen: true }); };
    const closeGuide = () => { this._done = true; try { window.sessionStorage.setItem("aiclGuideSeen", "1"); } catch (err) {} this.setState({ guideOpen: false }); };

    return Object.assign({ showNotes: this.props.showNotes ?? true, faqs: faqs, guideOpen: s.guideOpen, openGuide: openGuide, closeGuide: closeGuide }, {});
  }
}
DCStart(Component);
</script>
